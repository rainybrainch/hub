<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASK2 - 毎日の市場分析と漫画</title>
  <link rel="icon" href="hub-icon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Zen Maru Gothic", "Segoe UI", sans-serif; background: linear-gradient(135deg, #0d1117 0%, #1a1f3a 100%); color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-screen.hidden { display: none; }
    .login-box { background: #1a1f3a; padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); width: 100%; max-width: 400px; border: 1px solid rgba(91, 200, 232, 0.2); }
    .login-box h1 { font-size: 32px; margin-bottom: 30px; color: #5BC8E8; text-align: center; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #5BC8E8; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid rgba(91, 200, 232, 0.3); border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: #fff; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: #5BC8E8; color: #0d1117; margin-bottom: 12px; }
    .btn-secondary { background: rgba(91, 200, 232, 0.2); color: #5BC8E8; border: 1px solid #5BC8E8; }
    .main-content { display: none; }
    .main-content.visible { display: block; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(91, 200, 232, 0.2); }
    .header h1 { font-size: 28px; color: #5BC8E8; }
    .header-right { display: flex; gap: 15px; align-items: center; }
    .user-info { font-size: 12px; color: rgba(255, 255, 255, 0.6); }
    .btn-logout { padding: 8px 16px; background: rgba(232, 53, 74, 0.2); color: #E8354A; border: 1px solid #E8354A; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .calendar-section { background: rgba(26, 31, 58, 0.5); border: 1px solid rgba(91, 200, 232, 0.1); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .calendar-nav { display: flex; gap: 15px; }
    .calendar-nav button { padding: 8px 16px; background: rgba(91, 200, 232, 0.1); color: #5BC8E8; border: 1px solid rgba(91, 200, 232, 0.3); border-radius: 4px; cursor: pointer; }
    .month-year { font-size: 24px; font-weight: 700; color: #fff; min-width: 200px; text-align: center; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
    .weekday { text-align: center; font-size: 12px; font-weight: 700; color: #5BC8E8; padding: 12px 0; }
    .day { aspect-ratio: 1; border: 1px solid rgba(91, 200, 232, 0.1); border-radius: 8px; padding: 10px; background: rgba(255, 255, 255, 0.02); cursor: pointer; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .day:hover { border-color: #5BC8E8; background: rgba(91, 200, 232, 0.05); }
    .day.other-month { opacity: 0.3; }
    .day.today { border-color: #5BC8E8; background: rgba(91, 200, 232, 0.1); }
    .day.has-data { border-color: #4CAF7D; background: rgba(76, 175, 125, 0.1); }
    .day-number { font-size: 14px; font-weight: 700; color: #fff; }
    .day-indicator { font-size: 20px; margin-top: 4px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 999; align-items: center; justify-content: center; }
    .modal.visible { display: flex; }
    .modal-content { background: #1a1f3a; border-radius: 12px; padding: 30px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(91, 200, 232, 0.2); }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .modal-header h2 { font-size: 20px; color: #5BC8E8; }
    .modal-close { background: none; border: none; color: #5BC8E8; font-size: 24px; cursor: pointer; }
    .modal-section { margin-bottom: 25px; }
    .modal-section h3 { font-size: 14px; font-weight: 700; color: #5BC8E8; margin-bottom: 12px; text-transform: uppercase; }
    .modal-section textarea { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(91, 200, 232, 0.2); border-radius: 6px; color: #fff; font-family: "Zen Maru Gothic", sans-serif; min-height: 100px; resize: vertical; }
    .image-upload-zone { border: 2px dashed rgba(91, 200, 232, 0.4); border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; background: rgba(91, 200, 232, 0.05); }
    .image-upload-zone.drag-over { border-color: #5BC8E8; background: rgba(91, 200, 232, 0.15); }
    .image-container { margin-top: 12px; }
    .image-container img { max-width: 100%; max-height: 300px; border-radius: 4px; }
    .modal-actions { display: flex; gap: 12px; margin-top: 25px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-save { background: #5BC8E8; color: #0d1117; }
    .btn-cancel { background: rgba(91, 200, 232, 0.1); color: #5BC8E8; border: 1px solid rgba(91, 200, 232, 0.3); }
    .error-msg { color: #E8354A; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>ASK2</h1>
      <div class="form-group">
        <label for="loginEmail">メールアドレス</label>
        <input type="email" id="loginEmail" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="loginPassword">パスワード</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="loginBtn">ログイン</button>
      <button class="btn btn-secondary" id="signupBtn">アカウント作成</button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <div class="main-content" id="mainContent">
    <div class="container">
      <div class="header">
        <h1>ASK2 - 毎日の市場分析と漫画</h1>
        <div class="header-right">
          <div class="user-info">ユーザー: <span id="userEmail">-</span></div>
          <button class="btn-logout" id="logoutBtn">ログアウト</button>
        </div>
      </div>

      <div class="calendar-section">
        <div class="calendar-header">
          <div class="calendar-nav">
            <button id="prevBtn">← 前月</button>
            <div class="month-year" id="monthYear">2026年1月</div>
            <button id="nextBtn">翌月 →</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalDate">2026年1月1日</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>

      <div class="modal-section">
        <h3>ASK1 要約</h3>
        <textarea id="ask1Summary" placeholder="ASK1の要約を記入..."></textarea>
      </div>

      <div class="modal-section">
        <h3>市場分析</h3>
        <textarea id="marketAnalysis" placeholder="今日の市場分析を記入..."></textarea>
      </div>

      <div class="modal-section">
        <h3>漫画</h3>
        <div class="image-upload-zone" id="mangaDropZone">
          <p>🖼️ 画像をドラッグ&ドロップ</p>
          <p>または クリックして選択</p>
          <input type="file" id="mangaFileInput" accept="image/*" style="display: none;">
        </div>
        <div class="image-container" id="mangaDisplay"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-save" id="saveBtn">保存</button>
        <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      </div>
      <div class="error-msg" id="modalError"></div>
    </div>
  </div>

  <script>
    let currentUser = null, currentDate = new Date(), selectedDate = null, currentData = {};

    function checkAuth() {
      const storedUser = localStorage.getItem('ask2_user');
      if (storedUser) {
        currentUser = JSON.parse(storedUser);
        showMainContent();
      } else {
        showLoginScreen();
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      if (!email || !password) {
        errorEl.textContent = 'メールアドレスとパスワードを入力してください';
        return;
      }
      if (email === 'rainybrain.ch@gmail.com' && password === 'ASK2') {
        currentUser = { email, uid: btoa(email) };
        localStorage.setItem('ask2_user', JSON.stringify(currentUser));
        errorEl.textContent = '';
        showMainContent();
      } else {
        errorEl.textContent = 'メールアドレスまたはパスワードが間違っています';
      }
    });

    document.getElementById('signupBtn').addEventListener('click', () => {
      alert('アカウント作成は現在利用できません。管理者にお問い合わせください。');
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      localStorage.removeItem('ask2_user');
      showLoginScreen();
    });

    function showLoginScreen() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('mainContent').classList.remove('visible');
    }

    function showMainContent() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainContent').classList.add('visible');
      document.getElementById('userEmail').textContent = currentUser.email;
      renderCalendar();
      loadData();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      document.getElementById('monthYear').textContent = `${year}年${month + 1}月`;
      const firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0), prevLastDay = new Date(year, month, 0);
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      ['日', '月', '火', '水', '木', '金', '土'].forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = day;
        grid.appendChild(el);
      });
      for (let i = prevLastDay.getDate() - firstDay.getDay() + 1; i <= prevLastDay.getDate(); i++) {
        addDayElement(grid, i, month - 1, year, true);
      }
      for (let i = 1; i <= lastDay.getDate(); i++) {
        addDayElement(grid, i, month, year, false);
      }
      for (let i = 1; i <= (7 - lastDay.getDay() - 1); i++) {
        addDayElement(grid, i, month + 1, year, true);
      }
    }

    function addDayElement(grid, date, month, year, otherMonth) {
      const el = document.createElement('div');
      el.className = 'day';
      if (otherMonth) {
        el.classList.add('other-month');
        el.innerHTML = `<div class="day-number">${date}</div>`;
      } else {
        const today = new Date();
        if (date === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          el.classList.add('today');
        }
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        if (currentData[dateStr]) {
          el.classList.add('has-data');
          el.innerHTML = `<div class="day-number">${date}</div><div class="day-indicator">📝</div>`;
        } else {
          el.innerHTML = `<div class="day-number">${date}</div>`;
        }
        el.addEventListener('click', () => openDetailModal(date, month, year));
      }
      grid.appendChild(el);
    }

    function openDetailModal(date, month, year) {
      selectedDate = new Date(year, month, date);
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const data = currentData[dateStr] || {};
      document.getElementById('modalDate').textContent = `${year}年${month + 1}月${date}日`;
      document.getElementById('ask1Summary').value = data.ask1Summary || '';
      document.getElementById('marketAnalysis').value = data.marketAnalysis || '';
      const mangaDisplay = document.getElementById('mangaDisplay');
      mangaDisplay.innerHTML = data.manga ? `<img src="${data.manga}" alt="漫画">` : '';
      setupImageUpload();
      document.getElementById('detailModal').classList.add('visible');
    }

    document.getElementById('modalCloseBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('visible');
      selectedDate = null;
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('visible');
      selectedDate = null;
    });

    function setupImageUpload() {
      const dropZone = document.getElementById('mangaDropZone');
      const fileInput = document.getElementById('mangaFileInput');
      dropZone.onclick = () => fileInput.click();
      dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
      dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) handleImageFile(e.dataTransfer.files[0]);
      };
      fileInput.onchange = (e) => {
        if (e.target.files.length > 0) handleImageFile(e.target.files[0]);
      };
    }

    function handleImageFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let width = img.width, height = img.height;
          if (width > 800) {
            height = (height * 800) / width;
            width = 800;
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('mangaDisplay').innerHTML = `<img src="${compressedBase64}" alt="漫画">`;
          const dateStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`;
          currentData[dateStr] = currentData[dateStr] || {};
          currentData[dateStr].manga = compressedBase64;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!selectedDate) return;
      const dateStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`;
      currentData[dateStr] = {
        ask1Summary: document.getElementById('ask1Summary').value,
        marketAnalysis: document.getElementById('marketAnalysis').value,
        manga: currentData[dateStr]?.manga || null,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('ask2_data', JSON.stringify(currentData));
      document.getElementById('detailModal').classList.remove('visible');
      renderCalendar();
    });

    function loadData() {
      const stored = localStorage.getItem('ask2_data');
      if (stored) currentData = JSON.parse(stored);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    checkAuth();
  </script>
</body>
</html>
