<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASK2 - 豈取律縺ｮ蟶ょｴ蛻・梵縺ｨ貍ｫ逕ｻ</title>
  <link rel="icon" href="hub-icon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #1a1f3a;
      --bg-tertiary: rgba(26, 31, 58, 0.5);
      --text-primary: #fff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --border-color: rgba(91, 200, 232, 0.2);
      --accent: #5BC8E8;
      --accent-hover: #6dd9ff;
      --error: #E8354A;
      --success: #4CAF7D;
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    body.light-mode {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: rgba(229, 231, 235, 0.5);
      --text-primary: #1e293b;
      --text-secondary: rgba(30, 41, 59, 0.6);
      --border-color: rgba(91, 200, 232, 0.3);
      --accent: #0891b2;
      --accent-hover: #06b6d4;
      --error: #dc2626;
      --success: #16a34a;
      --input-bg: rgba(30, 41, 59, 0.05);
    }

    body {
      font-family: "Zen Maru Gothic", "Segoe UI", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.95);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .login-screen.light-mode {
      background: rgba(248, 250, 252, 0.95);
    }
    .login-screen.hidden { display: none; }

    .login-box {
      background: var(--bg-secondary);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%; max-width: 400px;
      border: 1px solid var(--border-color);
    }
    .login-box h1 {
      font-size: 32px; margin-bottom: 30px;
      color: var(--accent);
      text-align: center;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent);
    }
    .form-group input {
      width: 100%; padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text-primary);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 200, 232, 0.1);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: var(--bg-primary);
      margin-bottom: 12px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-secondary:hover {
      background: rgba(91, 200, 232, 0.1);
    }

    .main-content { display: none; }
    .main-content.visible { display: block; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h1 {
      font-size: 28px;
      color: var(--accent);
    }
    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .user-info {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .theme-toggle {
      padding: 8px 16px;
      background: var(--input-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .theme-toggle:hover {
      background: rgba(91, 200, 232, 0.1);
    }

    .btn-logout {
      padding: 8px 16px;
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-export, .btn-import, .btn-report, .btn-history {
      padding: 8px 12px;
      background: rgba(76, 175, 125, 0.2);
      color: #4CAF7D;
      border: 1px solid #4CAF7D;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-export:hover, .btn-import:hover, .btn-report:hover, .btn-history:hover {
      background: rgba(76, 175, 125, 0.4);
      transform: translateY(-2px);
    }
    .modal-small {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 1000;
    }
    .modal-small.visible { display: block; }
    #reportContent { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
        .btn-export,.btn-import,.btn-report{padding:8px 12px;background:rgba(76,175,125,0.2);color:#4CAF7D;border:1px solid #4CAF7D;border-radius:4px;cursor:pointer;font-size:12px;margin:0 4px;}.btn-export:hover,.btn-import:hover,.btn-report:hover{background:rgba(76,175,125,0.4);} @media(max-width:640px){.header-right{flex-direction:column;width:100%;}.header{flex-direction:column;}.calendar-nav{flex-wrap:wrap;}.day{min-height:60px;font-size:11px;}.modal-content{max-width:95vw;padding:15px;}.modal-section textarea{min-height:80px;}.image-container{gap:8px;}.image-container img{max-width:120px;}} .btn-logout:hover {
      background: rgba(232, 53, 74, 0.1);
    }

    .calendar-section {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }
    .calendar-nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .calendar-nav button {
      padding: 8px 16px;
      background: var(--input-bg);
      color: var(--accent);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .calendar-nav button:hover {
      border-color: var(--accent);
      background: rgba(91, 200, 232, 0.05);
    }
    .month-year {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 180px;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      padding: 12px 0;
    }

    .day {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: var(--input-bg);
      cursor: pointer;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .day:hover {
      border-color: var(--accent);
      background: rgba(91, 200, 232, 0.1);
      transform: translateY(-2px);
    }
    .day.other-month {
      opacity: 0.3;
    }
    .day.today {
      border-color: var(--accent);
      background: rgba(91, 200, 232, 0.15);
      box-shadow: 0 0 0 2px rgba(91, 200, 232, 0.3);
    }
    .day.has-data {
      border-color: var(--success);
      background: rgba(76, 175, 125, 0.1);
    }
    .day-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .day-indicator {
      font-size: 20px;
      margin-top: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body.light-mode .modal {
      background: rgba(0, 0, 0, 0.4);
    }
    .modal.visible { display: flex; }

    .modal-content {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      font-size: 20px;
      color: var(--accent);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover {
      color: var(--error);
    }

    .modal-section {
      margin-bottom: 25px;
    }
    .modal-section h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .modal-section textarea {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: "Zen Maru Gothic", sans-serif;
      min-height: 100px;
      resize: vertical;
      transition: all 0.2s;
    }
    .modal-section textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 200, 232, 0.1);
    }

    .image-upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: var(--input-bg);
      transition: all 0.2s;
    }
    .image-upload-zone:hover {
      border-color: var(--accent);
      background: rgba(91, 200, 232, 0.05);
    }
    .image-upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(91, 200, 232, 0.15);
    }
    .image-container {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .image-item {
      position: relative;
      display: inline-block;
    }
    .image-container img {
      max-width: 150px;
      max-height: 150px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .image-delete {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--error);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .image-delete:hover {
      transform: scale(1.1);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save {
      background: var(--accent);
      color: var(--bg-primary);
    }
    .btn-save:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .btn-cancel {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-cancel:hover{
      background: rgba(91, 200, 232, 0.1);
    }

    .error-msg {
      color: var(--error);
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 20px; }
      .header { flex-direction: column; align-items: flex-start; }
      .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 8px; }
      .day { min-height: 80px; font-size: 12px; }
      .modal-content { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="main-content" id="mainContent">
    <div class="container">
      <div class="header">
        <h1>ASK2 - 豈取律縺ｮ蟶ょｴ蛻・梵縺ｨ貍ｫ逕ｻ</h1>
        <div class="header-right">
          <div class="user-info">繝ｦ繝ｼ繧ｶ繝ｼ: <span id="userEmail">-</span></div>
          <button class="theme-toggle" id="themeToggle">嫌 繝ｩ繧､繝医Δ繝ｼ繝・/button>
          <button class="btn-logout" id="logoutBtn">繝ｭ繧ｰ繧｢繧ｦ繝・/button>
        <button class="btn-export" id="exportBtn" title="JSON形式でエクスポート">💾 出力</button>
          <button class="btn-import" id="importBtn" title="JSON形式でインポート">📥 読込</button>
          <button class="btn-report" id="reportBtn" title="月間レポートを生成">📄 レポ</button>
          <button class="btn-history" id="historyBtn" title="編集履歴">↩️ 履歴</button>
      </div>

      <div class="calendar-section">
        <div class="calendar-header">
          <div class="calendar-nav">
            <button id="prevBtn">竊・蜑肴怦</button>
            <div class="month-year" id="monthYear">2026蟷ｴ1譛・/div>
            <button id="nextBtn">鄙梧怦 竊・/button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalDate">2026蟷ｴ1譛・譌･</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>

      <div class="modal-section">
        <h3>ASK1 隕∫ｴ・/h3>
        <textarea id="ask1Summary" placeholder="ASK1縺ｮ隕∫ｴ・ｒ險伜・..."></textarea>
      </div>

      <div class="modal-section">
        <h3>蟶ょｴ蛻・梵</h3>
        <textarea id="marketAnalysis" placeholder="莉頑律縺ｮ蟶ょｴ蛻・梵繧定ｨ伜・..."></textarea>
      </div>

      <div class="modal-section">
        <h3>貍ｫ逕ｻ逕ｻ蜒・/h3>
        <div class="image-upload-zone" id="mangaDropZone">
          <p>名・・逕ｻ蜒上ｒ繝峨Λ繝・げ&繝峨Ο繝・・</p>
          <p>縺ｾ縺溘・ 繧ｯ繝ｪ繝・け縺励※驕ｸ謚橸ｼ郁､・焚蜿ｯ・・/p>
          <input type="file" id="mangaFileInput" accept="image/*" multiple style="display: none;">
        </div>
        <div class="image-container" id="mangaDisplay"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-save" id="saveBtn">菫晏ｭ・/button>
        <button class="btn-cancel" id="cancelBtn">繧ｭ繝｣繝ｳ繧ｻ繝ｫ</button>
      </div>
      <div class="error-msg" id="modalError"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentDate = new Date();
    let selectedDate = null;
    let currentData = {};
    let currentImages = [];

    // Theme management
    function initTheme() {
      const savedTheme = localStorage.getItem('ask2_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.querySelector('.login-screen')?.classList.add('light-mode');
        document.getElementById('themeToggle').textContent = '捲 繝繝ｼ繧ｯ繝｢繝ｼ繝・;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          document.body.classList.toggle('light-mode');
          document.querySelector('.login-screen')?.classList.toggle('light-mode');
          const isLight = document.body.classList.contains('light-mode');
          localStorage.setItem('ask2_theme', isLight ? 'light' : 'dark');
          themeToggle.textContent = isLight ? '捲 繝繝ｼ繧ｯ繝｢繝ｼ繝・ : '嫌 繝ｩ繧､繝医Δ繝ｼ繝・;
        });
      }
    });

    function checkAuth() {
      currentUser = { email: 'rainybrain.ch@gmail.com', uid: 'ask2' };
      localStorage.setItem('ask2_user', JSON.stringify(currentUser));
      showMainContent();
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      location.reload();
    });

    function showMainContent() {
      document.getElementById('mainContent').classList.add('visible');
      document.getElementById('userEmail').textContent = currentUser.email;
      renderCalendar();
      loadData();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthYear').textContent = `${year}蟷ｴ${month + 1}譛・;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const prevLastDay = new Date(year, month, 0);

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      ['譌･', '譛・, '轣ｫ', '豌ｴ', '譛ｨ', '驥・, '蝨・].forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = day;
        grid.appendChild(el);
      });

      for (let i = prevLastDay.getDate() - firstDay.getDay() + 1; i <= prevLastDay.getDate(); i++) {
        addDayElement(grid, i, month - 1, year, true);
      }

      for (let i = 1; i <= lastDay.getDate(); i++) {
        addDayElement(grid, i, month, year, false);
      }

      for (let i = 1; i <= (7 - lastDay.getDay() - 1); i++) {
        addDayElement(grid, i, month + 1, year, true);
      }
    }

    function addDayElement(grid, date, month, year, otherMonth) {
      const el = document.createElement('div');
      el.className = 'day';

      if (otherMonth) {
        el.classList.add('other-month');
        el.innerHTML = `<div class="day-number">${date}</div>`;
      } else {
        const today = new Date();
        if (date === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          el.classList.add('today');
        }

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        if (currentData[dateStr]) {
          el.classList.add('has-data');
          el.innerHTML = `<div class="day-number">${date}</div><div class="day-indicator">統</div>`;
        } else {
          el.innerHTML = `<div class="day-number">${date}</div>`;
        }

        el.addEventListener('click', () => openDetailModal(date, month, year));
      }

      grid.appendChild(el);
    }

    function openDetailModal(date, month, year) {
      selectedDate = new Date(year, month, date);
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

      const data = currentData[dateStr] || {};
      currentImages = data.images || [];

      document.getElementById('modalDate').textContent = `${year}蟷ｴ${month + 1}譛・{date}譌･`;
      document.getElementById('ask1Summary').value = data.ask1Summary || '';
      document.getElementById('marketAnalysis').value = data.marketAnalysis || '';

      renderImages();
      setupImageUpload();
      document.getElementById('detailModal').classList.add('visible');
    }

    function renderImages() {
      const container = document.getElementById('mangaDisplay');
      container.innerHTML = '';
      currentImages.forEach((img, idx) => {
        const item = document.createElement('div');
        item.className = 'image-item';
        item.innerHTML = `
          <img src="${img}" alt="逕ｻ蜒・>
          <button class="image-delete" data-idx="${idx}">ﾃ・/button>
        `;
        container.appendChild(item);

        item.querySelector('.image-delete').addEventListener('click', () => {
          currentImages.splice(idx, 1);
          renderImages();
        });
      });
    }

    document.getElementById('modalCloseBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('visible');
      selectedDate = null;
      currentImages = [];
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('visible');
      selectedDate = null;
      currentImages = [];
    });

    function setupImageUpload() {
      const dropZone = document.getElementById('mangaDropZone');
      const fileInput = document.getElementById('mangaFileInput');

      dropZone.onclick = () => fileInput.click();

      dropZone.ondragover = (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      };

      dropZone.ondragleave = () => dropZone.classList.remove('drag-over');

      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
          Array.from(e.dataTransfer.files).forEach(file => handleImageFile(file));
        }
      };

      fileInput.onchange = (e) => {
        if (e.target.files.length > 0) {
          Array.from(e.target.files).forEach(file => handleImageFile(file));
        }
      };
    }

    function handleImageFile(file) {
      const reader = new FileReader();

      reader.onload = (e) => {
        const img = new Image();

        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          let width = img.width;
          let height = img.height;

          if (width > 800) {
            height = (height * 800) / width;
            width = 800;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/webp', 0.8);
          currentImages.push(compressedBase64);
          renderImages();
        };

        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!selectedDate || !currentUser) return;

      const dateStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`;

      currentData[dateStr] = {
        ask1Summary: document.getElementById('ask1Summary').value,
        marketAnalysis: document.getElementById('marketAnalysis').value,
        images: currentImages,
        timestamp: new Date().toISOString()
      };

      localStorage.setItem('ask2_data', JSON.stringify(currentData));autoBackup(); autoBackup();

      document.getElementById('detailModal').classList.remove('visible');
      renderCalendar();
    });

    function loadData() {
      const stored = localStorage.getItem('ask2_data');
      if (stored) {
        currentData = JSON.parse(stored);
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });


    let editHistory = [];
    const MAX_HISTORY = 20;

    function saveToHistory() {
      editHistory.push(JSON.parse(JSON.stringify(currentData)));
      if (editHistory.length > MAX_HISTORY) editHistory.shift();
    }

    function undo() {
      if (editHistory.length > 0) {
        currentData = editHistory.pop();
        localStorage.setItem('ask2_data', JSON.stringify(currentData));autoBackup(); autoBackup();
        renderCalendar();
      }
    }

    function exportData() {
      const dataStr = JSON.stringify(currentData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ask2_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            saveToHistory();
            currentData = imported;
            localStorage.setItem('ask2_data', JSON.stringify(currentData));autoBackup(); autoBackup();
            autoBackup();
            renderCalendar();
            alert('✅ データをインポートしました');
          } catch (err) {
            alert('❌ ファイルフォーマットが正しくありません');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function generateReport() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const daysInMonth = new Date(year, month, 0).getDate();
      let report = `ASK2 月間レポート
${year}年${month}月

`;
      let filledDays = 0;
      let totalImages = 0;

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const data = currentData[dateStr];
        if (data) {
          filledDays++;
          const imgCount = (data.images || []).length;
          totalImages += imgCount;
          report += `【${dateStr}】
`;
          if (data.ask1Summary) report += `ASK1: ${data.ask1Summary.substring(0, 40)}
`;
          if (data.marketAnalysis) report += `分析: ${data.marketAnalysis.substring(0, 40)}
`;
          if (imgCount > 0) report += `画像: ${imgCount}枚
`;
          report += '
';
        }
      }
      report += `
統計
記入率: ${Math.round((filledDays/daysInMonth)*100)}%
画像: ${totalImages}枚
`;
      return report;
    }

    function showReport() {
      const modal = document.getElementById('reportModal') || createReportModal();
      const report = generateReport();
      document.getElementById('reportContent').textContent = report;
      modal.classList.add('visible');
    }

    function createReportModal() {
      const modal = document.createElement('div');
      modal.id = 'reportModal';
      modal.className = 'modal-small';
      modal.innerHTML = `<button class="modal-small-close" onclick="this.parentElement.classList.remove('visible')">&times;</button><h3>月間レポート</h3><div id="reportContent"></div><button onclick="downloadReport()" style="margin-top:15px;padding:10px;background:var(--accent);color:var(--bg-primary);border:none;border-radius:6px;cursor:pointer;">ダウンロード</button>`;
      document.body.appendChild(modal);
      return modal;
    }

    function downloadReport() {
      const report = generateReport();
      const blob = new Blob([report], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ask2_report_${new Date().toISOString().split('T')[0]}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function autoBackup() {
      const backup = { data: currentData, timestamp: new Date().toISOString() };
      localStorage.setItem('ask2_backup', JSON.stringify(backup));
    }

    function attachToolbarButtons() {
      const exportBtn = document.getElementById('exportBtn');
      const importBtn = document.getElementById('importBtn');
      const reportBtn = document.getElementById('reportBtn');
      const historyBtn = document.getElementById('historyBtn');
      
      if (exportBtn) exportBtn.addEventListener('click', exportData);
      if (importBtn) importBtn.addEventListener('click', importData);
      if (reportBtn) reportBtn.addEventListener('click', showReport);
      if (historyBtn) historyBtn.addEventListener('click', undo);
      
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
      });
    }
    
    attachToolbarButtons();
