<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>習慣トラッカー | RAINYBRAIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--sky:#5BC8E8;--gold:#F5C842;--gold-d:#D4A017;--green:#4CAF7D;--red:#E8354A;--purple:#9B6DD6;--dark:#0d1117;--dark2:#161b22;--dark3:#21262d;--white:#fff;--muted:rgba(255,255,255,.45)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Zen Maru Gothic",sans-serif;background:var(--dark);color:var(--white);min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased;overflow-x:hidden}

    /* Header */
    .hdr{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);padding:14px 20px;display:flex;align-items:center;gap:12px}
    .back{display:flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;transition:background .15s}
    .back:hover{background:rgba(245,200,66,.1)}
    .hdr-title{font-family:"Dela Gothic One",sans-serif;font-size:18px;flex:1}
    .hdr-date{font-size:11px;color:var(--muted);text-align:right}

    /* Container */
    .wrap{max-width:520px;margin:0 auto;padding:20px 16px}

    /* Stats strip */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .stat{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 12px;text-align:center}
    .stat-val{font-family:"Dela Gothic One",sans-serif;font-size:28px;line-height:1;margin-bottom:4px}
    .stat-val.gold{color:var(--gold)}
    .stat-val.sky{color:var(--sky)}
    .stat-val.green{color:var(--green)}
    .stat-lbl{font-size:10px;color:var(--muted);letter-spacing:.1em}

    /* Weekly chart — cycle 1 feature */
    .chart-box{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;margin-bottom:20px}
    .chart-ttl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
    .chart-bars{display:flex;gap:6px;align-items:flex-end;height:80px}
    .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
    .bar-wrap{flex:1;width:100%;background:rgba(255,255,255,.06);border-radius:4px;position:relative;overflow:hidden;min-height:60px}
    .bar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:4px;transition:height .6s cubic-bezier(.34,1.56,.64,1)}
    .bar-fill.today{background:linear-gradient(180deg,var(--sky),#2a8eb0)}
    .bar-lbl{font-size:9px;color:var(--muted);font-weight:700}
    .bar-lbl.today{color:var(--sky)}

    /* Streak badge — cycle 2 feature */
    .streak-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .streak-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,rgba(245,200,66,.15),rgba(212,160,23,.1));border:1px solid rgba(245,200,66,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--gold);transition:all .3s}
    .streak-badge.fire{box-shadow:0 0 16px rgba(245,200,66,.3);border-color:rgba(245,200,66,.6)}

    /* Category tabs */
    .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;background:none;font-family:"Zen Maru Gothic",sans-serif}
    .tab:hover{color:var(--white);border-color:rgba(255,255,255,.3)}
    .tab.active[data-cat="all"]{background:var(--gold);border-color:transparent;color:var(--dark)}
    .tab.active[data-cat="学習"]{background:var(--sky);border-color:transparent;color:var(--dark)}
    .tab.active[data-cat="運動"]{background:var(--green);border-color:transparent;color:var(--dark)}
    .tab.active[data-cat="創作"]{background:var(--purple);border-color:transparent;color:var(--white)}
    .tab.active[data-cat="自己改善"]{background:var(--gold);border-color:transparent;color:var(--dark)}

    /* Habit list */
    .habit-sec{margin-bottom:24px}
    .sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .sec-name{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    .sec-count{font-size:11px;color:var(--muted)}

    /* Cycle 8: category progress bar in section header */
    .sec-progress{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 6px}
    .sec-progress-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}

    .habit{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:transform .12s,background .15s,border-color .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
    .habit:active{transform:scale(.98)}
    .habit.done{background:rgba(76,175,125,.08);border-color:rgba(76,175,125,.2)}
    .chk{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
    .habit.done .chk{background:var(--green);border-color:var(--green);transform:scale(1.1)}
    .chk-ico{display:none;font-size:13px;color:var(--dark);font-weight:900}
    .habit.done .chk-ico{display:block}
    .habit-info{flex:1;min-width:0}
    .habit-name{font-size:14px;font-weight:700;transition:color .15s;display:block}
    .habit-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
    .habit.done .habit-note{opacity:.65}
    body.light .habit-note{color:rgba(0,0,0,.4)}
    .habit.done .habit-name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(76,175,125,.5)}
    .cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .del-btn{background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:18px;padding:4px 6px;border-radius:6px;transition:all .15s;flex-shrink:0;line-height:1}
    .del-btn:hover{color:var(--red);background:rgba(232,53,74,.1)}
    .edit-btn{background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;transition:all .15s;flex-shrink:0;line-height:1}
    .edit-btn:hover{color:var(--sky);background:rgba(91,200,232,.1)}

    /* Empty state */
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty-ico{font-size:52px;margin-bottom:12px}
    .empty-txt{font-size:13px}

    /* FAB */
    .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--dark);border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(245,200,66,.4);transition:transform .2s cubic-bezier(.34,1.56,.64,1);z-index:200;font-weight:900}
    .fab:hover{transform:scale(1.1)}
    .fab:active{transform:scale(.95)}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.open{opacity:1;pointer-events:auto}
    .modal{background:var(--dark2);border:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:520px;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
    .overlay.open .modal{transform:translateY(0)}
    .modal-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 20px}
    .modal-ttl{font-family:"Dela Gothic One",sans-serif;font-size:18px;margin-bottom:20px}
    .modal-inp{width:100%;background:var(--dark3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;color:var(--white);font-family:"Zen Maru Gothic",sans-serif;font-size:15px;outline:none;transition:border-color .15s;margin-bottom:14px}
    .modal-inp:focus{border-color:rgba(245,200,66,.4)}
    .modal-inp::placeholder{color:var(--muted)}
    .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
    .cat-btn{padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:none;color:var(--muted);font-family:"Zen Maru Gothic",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
    .cat-btn:hover{color:var(--white)}
    .cat-btn.sel[data-cat="学習"]{background:rgba(91,200,232,.15);border-color:var(--sky);color:var(--sky)}
    .cat-btn.sel[data-cat="運動"]{background:rgba(76,175,125,.15);border-color:var(--green);color:var(--green)}
    .cat-btn.sel[data-cat="創作"]{background:rgba(155,109,214,.15);border-color:var(--purple);color:var(--purple)}
    .cat-btn.sel[data-cat="自己改善"]{background:rgba(245,200,66,.15);border-color:var(--gold);color:var(--gold)}
    .modal-ok{width:100%;padding:16px;border-radius:14px;background:var(--gold);border:none;color:var(--dark);font-family:"Zen Maru Gothic",sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:opacity .15s}
    .modal-ok:hover{opacity:.9}
    .modal-ok:disabled{opacity:.35;cursor:not-allowed}

    /* Celebration — cycle 2 feature */
    .banner{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-16px);background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--dark);font-family:"Dela Gothic One",sans-serif;font-size:14px;padding:12px 24px;border-radius:30px;box-shadow:0 8px 30px rgba(245,200,66,.5);z-index:400;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
    .banner.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Confetti canvas */
    #cfv{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500}

    /* Chart header + toggle — cycle 3 */
    .chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .chart-hdr .chart-ttl{margin-bottom:0}
    .chart-toggle{display:flex;gap:4px}
    .toggle-btn{padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:none;color:var(--muted);font-family:"Zen Maru Gothic",sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .toggle-btn.active{background:var(--gold);border-color:transparent;color:var(--dark)}

    /* Monthly heatmap — cycle 3 */
    .heatmap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
    .hm-cell{aspect-ratio:1;border-radius:3px;cursor:default;transition:transform .1s}
    .hm-cell:hover{transform:scale(1.25)}

    /* Progress ring — cycle 4 */
    .progress-ring-wrap{position:relative;width:62px;height:62px;margin:0 auto 4px}
    .progress-ring{width:62px;height:62px}
    .ring-fill{transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1)}
    .ring-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:"Dela Gothic One",sans-serif;font-size:14px;line-height:1;white-space:nowrap}

    /* Habit count badge — cycle 4 */
    .habit-cnt{font-size:10px;color:var(--muted);font-weight:700;flex-shrink:0;padding:2px 6px;background:rgba(255,255,255,.06);border-radius:6px;line-height:1.5}

    /* Cycle 8: per-habit individual streak badge */
    .habit-streak{font-size:10px;color:var(--gold);font-weight:700;flex-shrink:0;padding:2px 5px;background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.2);border-radius:6px;line-height:1.5}

    /* Export button in header — cycle 5 */
    .hdr-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px;transition:all .15s;line-height:1;flex-shrink:0}
    .hdr-btn:hover{color:var(--white);background:rgba(255,255,255,.08)}
    .hdr-btn:active{transform:scale(.92)}
    /* Best streak sub-label — cycle 5 */
    .stat-sub{font-size:9px;color:rgba(255,255,255,.3);margin-top:3px;letter-spacing:.05em}

    /* Cycle 7: theme toggle button */
    .theme-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:8px;transition:all .15s;line-height:1;flex-shrink:0}
    .theme-btn:hover{background:rgba(255,255,255,.08)}

    /* Cycle 7: sort undone button */
    .sort-row{display:flex;align-items:center;margin-bottom:10px}
    .sort-btn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:none;color:var(--muted);font-family:"Zen Maru Gothic",sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .sort-btn:hover{color:var(--white);border-color:rgba(255,255,255,.3)}
    .sort-btn.active{background:rgba(91,200,232,.15);border-color:var(--sky);color:var(--sky)}

    /* Cycle 7: light mode */
    body.light{--dark2:#ffffff;--dark3:#e8eaed;--muted:rgba(0,0,0,.45);background:#f0f2f5;color:#1a1a2e}
    body.light .hdr{background:rgba(248,249,250,.95);border-bottom-color:rgba(0,0,0,.08)}
    body.light .stat,body.light .chart-box{border-color:rgba(0,0,0,.08)}
    body.light .bar-wrap{background:rgba(0,0,0,.06)}
    body.light .habit{border-color:rgba(0,0,0,.08)}
    body.light .habit.done{background:rgba(76,175,125,.1);border-color:rgba(76,175,125,.25)}
    body.light .chk{border-color:rgba(0,0,0,.2)}
    body.light .del-btn{color:rgba(0,0,0,.2)}
    body.light .edit-btn{color:rgba(0,0,0,.2)}
    body.light .modal{border-color:rgba(0,0,0,.1)}
    body.light .modal-handle{background:rgba(0,0,0,.1)}
    body.light .modal-inp{color:#1a1a2e;border-color:rgba(0,0,0,.1)}
    body.light .modal-inp::placeholder{color:rgba(0,0,0,.35)}
    body.light .cat-btn{border-color:rgba(0,0,0,.1);color:rgba(0,0,0,.5)}
    body.light .cat-btn:hover{color:#1a1a2e}
    body.light .toggle-btn{border-color:rgba(0,0,0,.1);color:rgba(0,0,0,.5)}
    body.light .tab{border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.45)}
    body.light .tab:hover{color:#1a1a2e;border-color:rgba(0,0,0,.3)}
    body.light .habit-cnt{background:rgba(0,0,0,.06)}
    body.light .stat-sub{color:rgba(0,0,0,.3)}
    body.light .hdr-btn{color:rgba(0,0,0,.4)}
    body.light .hdr-btn:hover{color:#1a1a2e;background:rgba(0,0,0,.08)}
    body.light .back:hover{background:rgba(0,0,0,.06)}
    body.light .theme-btn:hover{background:rgba(0,0,0,.08)}
    body.light .sort-btn{border-color:rgba(0,0,0,.12)}
    body.light .sort-btn:hover{color:#1a1a2e;border-color:rgba(0,0,0,.3)}
    body.light .streak-badge{background:linear-gradient(135deg,rgba(245,200,66,.2),rgba(212,160,23,.15))}
    body.light .progress-ring circle:first-child{stroke:rgba(0,0,0,.07)}
    body.light .habit-streak{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.35)}
    body.light .sec-progress{background:rgba(0,0,0,.08)}

    /* Cycle 9: completion timestamp badge */
    .done-time{font-size:10px;color:var(--green);font-weight:700;flex-shrink:0;padding:2px 5px;background:rgba(76,175,125,.12);border:1px solid rgba(76,175,125,.2);border-radius:6px;line-height:1.5}
    body.light .done-time{background:rgba(76,175,125,.15);border-color:rgba(76,175,125,.3)}

    /* Cycle 11: per-habit 7-day mini dot calendar */
    .h-dots{display:flex;gap:3px;align-items:center;flex-shrink:0}
    .h-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.12);transition:background .2s}
    .h-dot.done{background:var(--green);box-shadow:0 0 3px rgba(76,175,125,.5)}
    body.light .h-dot{background:rgba(0,0,0,.1)}
    body.light .h-dot.done{background:var(--green)}

    /* Cycle 9: daily motivational motto */
    .motto-box{background:linear-gradient(135deg,rgba(245,200,66,.06),rgba(91,200,232,.05));border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 16px;margin-bottom:16px;text-align:center;font-size:12px;color:var(--muted);font-style:italic;line-height:1.5;transition:all .3s}
    body.light .motto-box{background:linear-gradient(135deg,rgba(245,200,66,.1),rgba(91,200,232,.07));border-color:rgba(0,0,0,.08);color:rgba(0,0,0,.5)}

    /* Cycle 10: undo delete snackbar */
    .snackbar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2330;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:14px;z-index:600;opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 6px 28px rgba(0,0,0,.55);pointer-events:none;border:1px solid rgba(255,255,255,.1);max-width:calc(100vw - 32px)}
    .snackbar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
    .sb-msg{overflow:hidden;text-overflow:ellipsis;max-width:200px}
    .snackbar-undo{background:none;border:none;color:var(--gold);font-family:"Zen Maru Gothic",sans-serif;font-size:13px;font-weight:900;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background .15s;flex-shrink:0;letter-spacing:.05em}
    .snackbar-undo:hover{background:rgba(245,200,66,.15)}
    body.light .snackbar{background:#1a1a2e;border-color:rgba(255,255,255,.15)}

    /* Cycle 13: habit streak milestone toast */
    .milestone-toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-16px);background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--dark);font-family:"Dela Gothic One",sans-serif;font-size:13px;padding:10px 20px;border-radius:30px;box-shadow:0 8px 30px rgba(245,200,66,.55);z-index:450;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
    .milestone-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Cycle 13: compact view mode */
    body.compact .habit{padding:8px 12px}
    body.compact .h-dots{display:none}
    body.compact .habit-cnt{display:none}
    body.compact .habit-streak{display:none}
    body.compact .done-time{display:none}
    body.compact .habit-note{display:none}
    body.compact .habit-name{font-size:13px}
    body.compact .sec-progress{display:none}
    body.compact .chk{width:20px;height:20px;border-radius:6px}

    /* Cycle 14: real-time search filter */
    .search-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:relative}
    .search-inp{flex:1;background:var(--dark2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 34px 8px 12px;color:var(--white);font-family:"Zen Maru Gothic",sans-serif;font-size:13px;outline:none;transition:border-color .15s}
    .search-inp:focus{border-color:rgba(91,200,232,.4)}
    .search-inp::placeholder{color:var(--muted)}
    .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1;border-radius:4px;transition:color .15s}
    .search-clear:hover{color:var(--white)}
    body.light .search-inp{color:#1a1a2e;border-color:rgba(0,0,0,.1)}
    body.light .search-inp::placeholder{color:rgba(0,0,0,.35)}
    body.light .search-inp:focus{border-color:rgba(91,200,232,.4)}
    body.light .search-clear{color:rgba(0,0,0,.3)}
    body.light .search-clear:hover{color:#1a1a2e}

    /* Cycle 14: week-over-week comparison badge */
    .week-cmp{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;flex-shrink:0;letter-spacing:.03em}
    .week-cmp.up{color:var(--green);background:rgba(76,175,125,.12);border:1px solid rgba(76,175,125,.2)}
    .week-cmp.down{color:var(--red);background:rgba(232,53,74,.1);border:1px solid rgba(232,53,74,.15)}
    .week-cmp.same{color:var(--muted);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
    body.light .week-cmp.same{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1)}

    /* Cycle 15: habit emoji icon */
    .habit-name-row{display:flex;align-items:center;gap:5px}
    .habit-emoji{font-size:15px;flex-shrink:0;line-height:1}
    .modal-emoji-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
    .modal-emoji-lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em;flex-shrink:0}
    .modal-emoji-inp{width:52px;background:var(--dark3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;color:var(--white);font-size:20px;text-align:center;outline:none;transition:border-color .15s;flex-shrink:0}
    .modal-emoji-inp:focus{border-color:rgba(245,200,66,.4)}
    .emoji-presets{display:flex;flex-wrap:wrap;gap:4px;flex:1}
    .emoji-preset{background:none;border:1px solid rgba(255,255,255,.08);font-size:16px;cursor:pointer;padding:4px 3px;border-radius:7px;transition:all .12s;line-height:1;width:30px;text-align:center;flex-shrink:0}
    .emoji-preset:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
    .emoji-preset.sel{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.4)}
    body.light .modal-emoji-inp{color:#1a1a2e;border-color:rgba(0,0,0,.1)}
    body.light .emoji-preset{border-color:rgba(0,0,0,.1)}
    body.light .emoji-preset:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}
    body.light .emoji-preset.sel{background:rgba(245,200,66,.25);border-color:rgba(245,200,66,.5)}

    /* Cycle 16: progress ring glow on 100% */
    @keyframes ringGlow{from{filter:drop-shadow(0 0 3px var(--green))}to{filter:drop-shadow(0 0 9px var(--green))}}
    .progress-ring-wrap.ring-complete{animation:ringGlow 1.4s ease-in-out infinite alternate}

    /* Cycle 16: today's timeline */
    .timeline-box{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;margin-bottom:20px}
    .timeline-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .timeline-item:last-child{border-bottom:none;padding-bottom:0}
    .tl-time{font-size:11px;color:var(--green);font-weight:700;min-width:36px;flex-shrink:0;font-variant-numeric:tabular-nums}
    .tl-emoji{font-size:14px;flex-shrink:0;line-height:1}
    .tl-name{font-size:13px;font-weight:700}
    body.light .timeline-box{border-color:rgba(0,0,0,.08)}
    body.light .timeline-item{border-bottom-color:rgba(0,0,0,.05)}

    /* Cycle 17: weekly habit ranking card */
    .ranking-box{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;margin-bottom:16px}
    .ranking-ttl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    .ranking-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .ranking-item:last-child{border-bottom:none;padding-bottom:0}
    .rank-badge{font-size:16px;flex-shrink:0;width:24px;text-align:center;line-height:1}
    .rank-name{flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rank-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex:0 0 56px}
    .rank-bar-fill{height:100%;border-radius:2px;background:var(--gold);transition:width .5s cubic-bezier(.34,1.56,.64,1)}
    .rank-cnt{font-size:11px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
    body.light .ranking-box{border-color:rgba(0,0,0,.08)}
    body.light .ranking-item{border-bottom-color:rgba(0,0,0,.05)}
    body.light .rank-cnt{color:rgba(0,0,0,.4)}
    body.light .rank-bar{background:rgba(0,0,0,.08)}

    /* Cycle 18: weekday performance chart */
    .dow-box{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;margin-bottom:20px}
    .dow-bars{display:flex;gap:4px;align-items:flex-end;height:56px}
    .dow-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
    .dow-bar-wrap{flex:1;width:100%;background:rgba(255,255,255,.06);border-radius:4px;position:relative;overflow:hidden;min-height:40px}
    .dow-fill{position:absolute;bottom:0;left:0;right:0;border-radius:4px;transition:height .6s cubic-bezier(.34,1.56,.64,1)}
    .dow-lbl{font-size:9px;font-weight:700;color:var(--muted)}
    body.light .dow-box{border-color:rgba(0,0,0,.08)}
    body.light .dow-bar-wrap{background:rgba(0,0,0,.06)}

    /* Cycle 18: check particle burst */
    @keyframes burstDot{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
    .chk-burst-dot{position:absolute;width:5px;height:5px;border-radius:50%;transform-origin:center;animation:burstDot .55s cubic-bezier(.2,.8,.3,1) forwards}
  </style>
</head>
<body>

<canvas id="cfv"></canvas>

<header class="hdr">
  <a href="index.html" class="back">← Hub</a>
  <h1 class="hdr-title">📅 習慣トラッカー</h1>
  <button class="hdr-btn" onclick="shareWeeklySummary()" title="週間レポートをコピー">📋</button>
  <button class="hdr-btn" onclick="exportData()" title="データをエクスポート">📤</button>
  <button class="hdr-btn" onclick="importData()" title="データをインポート">📥</button>
  <button class="theme-btn" id="sound-btn" onclick="toggleSound()" title="サウンド切替"></button>
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="テーマ切替"></button>
  <button class="hdr-btn" id="compact-btn" onclick="toggleCompactView()" title="表示モード切替">⊟</button>
  <div class="hdr-date" id="hdr-date"></div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat">
      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/>
          <circle id="ring-fill" cx="28" cy="28" r="22" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="138.23" transform="rotate(-90 28 28)"/>
        </svg>
        <div class="ring-val gold" id="s-today">0%</div>
      </div>
      <div class="stat-lbl">今日の達成率</div>
    </div>
    <div class="stat">
      <div class="stat-val sky" id="s-streak">0</div>
      <div class="stat-lbl">🔥 連続記録</div>
      <div class="stat-sub" id="s-best">最高: 0日</div>
    </div>
    <div class="stat">
      <div class="stat-val green" id="s-total">0</div>
      <div class="stat-lbl">累計完了</div>
    </div>
  </div>

  <div class="chart-box">
    <div class="chart-hdr">
      <div class="chart-ttl" id="chart-ttl">📊 週間達成率</div>
      <span class="week-cmp same" id="week-cmp"></span>
      <div class="chart-toggle">
        <button class="toggle-btn active" data-view="week" onclick="setChartView('week')">週</button>
        <button class="toggle-btn" data-view="month" onclick="setChartView('month')">月</button>
      </div>
    </div>
    <div id="chart"></div>
  </div>

  <div class="dow-box" id="dow-box" style="display:none">
    <div class="chart-ttl">📈 曜日別 平均達成率（過去4週）</div>
    <div class="dow-bars" id="dow-chart"></div>
  </div>

  <div class="streak-row">
    <span class="streak-badge" id="streak-badge">🔥 0日連続達成中</span>
  </div>

  <div class="ranking-box" id="ranking-box" style="display:none"></div>

  <div class="motto-box" id="motto-box"></div>

  <div class="timeline-box" id="timeline-box" style="display:none">
    <div class="chart-ttl">⏱ 今日のタイムライン</div>
    <div id="timeline-list"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-cat="all" onclick="setFilter('all')">全て</button>
    <button class="tab" data-cat="学習" onclick="setFilter('学習')">📚 学習</button>
    <button class="tab" data-cat="運動" onclick="setFilter('運動')">💪 運動</button>
    <button class="tab" data-cat="創作" onclick="setFilter('創作')">🎨 創作</button>
    <button class="tab" data-cat="自己改善" onclick="setFilter('自己改善')">✨ 自己改善</button>
  </div>

  <div class="sort-row">
    <button class="sort-btn" id="sort-undone-btn" onclick="toggleSortUndone()">⬆ 未完了を上に</button>
  </div>
  <div class="search-row">
    <input class="search-inp" id="search-inp" type="text" placeholder="🔍 習慣を検索..." oninput="onSearch(this.value)" maxlength="30">
    <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none" aria-label="検索をクリア">✕</button>
  </div>
  <div id="list"></div>
</div>

<button class="fab" onclick="openModal()" aria-label="習慣を追加">＋</button>

<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 class="modal-ttl" id="modal-ttl">習慣を追加</h2>
    <input class="modal-inp" id="habit-inp" type="text" placeholder="習慣の名前..." maxlength="30"
      oninput="onHabitInput()" onkeydown="if(event.key==='Enter')saveHabit()">
    <input class="modal-inp" id="note-inp" type="text" placeholder="メモ（任意）..." maxlength="60" style="margin-bottom:14px">
    <div class="modal-emoji-row">
      <input class="modal-emoji-inp" id="emoji-inp" type="text" placeholder="🎯" maxlength="4" oninput="onEmojiInput(this.value)" title="絵文字アイコン（任意）">
      <div class="emoji-presets" id="emoji-presets"></div>
    </div>
    <div class="cat-grid">
      <button class="cat-btn" data-cat="学習" onclick="selCat('学習')">📚 学習</button>
      <button class="cat-btn" data-cat="運動" onclick="selCat('運動')">💪 運動</button>
      <button class="cat-btn" data-cat="創作" onclick="selCat('創作')">🎨 創作</button>
      <button class="cat-btn" data-cat="自己改善" onclick="selCat('自己改善')">✨ 自己改善</button>
    </div>
    <button class="modal-ok" id="modal-ok" onclick="saveHabit()" disabled>追加する</button>
  </div>
</div>

<div class="banner" id="banner">🎉 全習慣達成！今日も最高！</div>
<div class="milestone-toast" id="milestone-toast"></div>

<div class="snackbar" id="snackbar">
  <span class="sb-msg" id="sb-msg"></span>
  <button class="snackbar-undo" onclick="undoDelete()">元に戻す</button>
</div>

<script>
const HK = 'rh_habits', CK = 'rh_completions', BK = 'rh_best_streak';
const CAT_COLORS = {'学習':'#5BC8E8','運動':'#4CAF7D','創作':'#9B6DD6','自己改善':'#F5C842'};
// Cycle 15: preset emoji for habit icons
const EMOJI_PRESETS=['📚','📖','✏️','💪','🏃','🧘','🎨','🎵','📝','💡','🌱','⭐','🎯','🔔','🌅','🏆','💎','🔥','⚡','💤','🥗','💊','🛌','🧠'];
const DAYS = ['日','月','火','水','木','金','土'];
// Cycle 11: keyword→category mapping for auto-suggest
const CAT_KEYWORDS={'学習':['読書','英語','勉強','学習','プログラミング','コード','本','資格','テスト','語学','数学'],'運動':['走','ラン','筋トレ','ウォーク','歩','ヨガ','ストレッチ','スポーツ','水泳','自転車'],'創作':['描','絵','動画','音楽','写真','ブログ','創作','デザイン','イラスト','小説','作'],'自己改善':['瞑想','日記','睡眠','食事','節約','感謝','整理','片付','早起き']};

let habits = [], completions = {}, filter = 'all', selCatVal = '', celebrated = false, editingId = null, sortUndone = false, catAutoSel = false, searchQuery = '';

// ── Cycle 12: sound effects ──
let soundEnabled = localStorage.getItem('rh_sound') !== 'false';
function _audioCtx(){return new (window.AudioContext||window.webkitAudioContext)()}
function playTick(){
  if(!soundEnabled)return;
  try{
    const ctx=_audioCtx(),osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    osc.type='sine';osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660,ctx.currentTime+0.08);
    g.gain.setValueAtTime(0.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.22);
    osc.start();osc.stop(ctx.currentTime+0.22);
  }catch(e){}
}
function playCelebration(){
  if(!soundEnabled)return;
  try{
    const ctx=_audioCtx();
    [523,659,784,1047].forEach((f,i)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.connect(g);g.connect(ctx.destination);
      osc.frequency.value=f;
      const t=ctx.currentTime+i*0.12;
      g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      osc.start(t);osc.stop(t+0.35);
    });
  }catch(e){}
}
function toggleSound(){
  soundEnabled=!soundEnabled;
  localStorage.setItem('rh_sound',soundEnabled?'true':'false');
  updateSoundBtn();
}
function updateSoundBtn(){
  const btn=document.getElementById('sound-btn');
  if(btn)btn.textContent=soundEnabled?'🔊':'🔇';
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── Cycle 15: haptic vibration feedback ──
function vib(pattern){if(navigator.vibrate)navigator.vibrate(pattern)}

// ── Cycle 18: particle burst on habit check ──
function spawnBurst(x,y){
  const cols=['#4CAF7D','#5BC8E8','#F5C842','#9B6DD6'];
  const wrap=document.createElement('div');
  wrap.style.cssText=`position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:999`;
  for(let i=0;i<8;i++){
    const s=document.createElement('span');
    const angle=(i/8)*Math.PI*2,dist=16+Math.random()*14;
    s.className='chk-burst-dot';
    s.style.background=cols[i%cols.length];
    s.style.animationDelay=`${(Math.random()*40).toFixed(0)}ms`;
    s.style.setProperty('--tx',`${(Math.cos(angle)*dist).toFixed(1)}px`);
    s.style.setProperty('--ty',`${(Math.sin(angle)*dist).toFixed(1)}px`);
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),700);
}

// ── Cycle 15: emoji icon helpers ──
function initEmojiPresets(){
  const el=document.getElementById('emoji-presets');
  if(!el)return;
  el.innerHTML=EMOJI_PRESETS.map(e=>`<button class="emoji-preset" onclick="selectEmoji('${e}')" title="${e}">${e}</button>`).join('');
}
function selectEmoji(e){
  const inp=document.getElementById('emoji-inp');
  if(inp)inp.value=e;
  document.querySelectorAll('.emoji-preset').forEach(b=>b.classList.toggle('sel',b.textContent.trim()===e));
}
function onEmojiInput(val){
  const v=val.trim();
  document.querySelectorAll('.emoji-preset').forEach(b=>b.classList.toggle('sel',b.textContent.trim()===v));
}

// ── date helpers ──
function toStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){return toStr(new Date())}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d}
function dateAgo(n){return toStr(daysAgo(n))}

// ── storage ──
function load(){
  try{
    const h=localStorage.getItem(HK);
    habits=h?JSON.parse(h):defaults();
    const c=localStorage.getItem(CK);
    completions=c?JSON.parse(c):{};
  }catch{habits=defaults();completions={}}
  if(!habits.length)habits=defaults();
}
function saveH(){localStorage.setItem(HK,JSON.stringify(habits))}
function saveC(){localStorage.setItem(CK,JSON.stringify(completions))}

function defaults(){
  const t=new Date().toISOString();
  return[
    {id:'h1',name:'読書30分',category:'学習',createdAt:t},
    {id:'h2',name:'英語学習',category:'学習',createdAt:t},
    {id:'h3',name:'筋トレ',category:'運動',createdAt:t},
    {id:'h4',name:'ウォーキング',category:'運動',createdAt:t},
    {id:'h5',name:'YouTube動画制作',category:'創作',createdAt:t},
    {id:'h6',name:'瞑想',category:'自己改善',createdAt:t},
    {id:'h7',name:'日記',category:'自己改善',createdAt:t},
  ];
}

// ── stats ──
function dayRate(dateStr){
  if(!habits.length)return 0;
  const dc=completions[dateStr]||{};
  return habits.filter(h=>dc[h.id]).length/habits.length;
}
function todayRate(){return Math.round(dayRate(today())*100)}

function totalDone(){
  let n=0;
  for(const day of Object.values(completions))for(const v of Object.values(day))if(v)n++;
  return n;
}

// cycle 2: streak counter
function calcStreak(){
  if(!habits.length)return 0;
  let s=0,start=dayRate(today())===1?0:1;
  for(let d=start;d<365;d++){
    if(dayRate(dateAgo(d))===1)s++;else break;
  }
  return s;
}

// cycle 5: best streak persistence
function getBestStreak(){return parseInt(localStorage.getItem(BK)||'0')}
function updateBestStreak(current){
  const best=getBestStreak();
  if(current>best){localStorage.setItem(BK,current);return current}
  return best;
}

// cycle 5: JSON export
function exportData(){
  const data={version:'2.18',exportedAt:new Date().toISOString(),habits,completions};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`habit-backup-${today()}.json`;a.click();
  URL.revokeObjectURL(url);
}

// cycle 4: per-habit cumulative count
function habitTotalCount(id){
  return Object.values(completions).filter(day=>day[id]).length;
}

// cycle 8: per-habit individual consecutive streak
function habitStreak(id){
  let s=0,dc=completions[today()]||{};
  const start=dc[id]?0:1;
  for(let d=start;d<365;d++){
    if((completions[dateAgo(d)]||{})[id])s++;else break;
  }
  return s;
}

// cycle 11: 7-day dot calendar per habit (oldest→newest)
function habit7Days(id){
  return Array.from({length:7},(_,i)=>!!( completions[dateAgo(6-i)]||{})[id]);
}

// cycle 11: smart category auto-suggest based on habit name keywords
function suggestCategory(name){
  for(const[cat,kws]of Object.entries(CAT_KEYWORDS)){
    if(kws.some(kw=>name.includes(kw)))return cat;
  }
  return null;
}

// cycle 11: input handler with auto-suggest
function onHabitInput(){
  const name=document.getElementById('habit-inp').value.trim();
  if(!editingId&&(!selCatVal||catAutoSel)){
    const sug=name?suggestCategory(name):null;
    if(sug){
      selCatVal=sug;catAutoSel=true;
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('sel',b.dataset.cat===sug));
    }else if(!name&&catAutoSel){
      selCatVal='';catAutoSel=false;
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('sel'));
    }
  }
  validateModal();
}

// ── render ──
function renderHeader(){
  const now=new Date();
  document.getElementById('hdr-date').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${DAYS[now.getDay()]}）`;
}

function renderStats(){
  const rate=todayRate(),streak=calcStreak(),best=updateBestStreak(streak);
  document.getElementById('s-today').textContent=rate+'%';
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('s-total').textContent=totalDone();
  // cycle 5: best streak display
  const sb=document.getElementById('s-best');
  if(sb)sb.textContent=`最高: ${best}日`;
  const badge=document.getElementById('streak-badge');
  badge.textContent=`🔥 ${streak}日連続達成中`;
  badge.classList.toggle('fire',streak>=3);
  // cycle 4 + 16: update progress ring with dynamic color
  const rf=document.getElementById('ring-fill');
  if(rf){
    rf.style.strokeDashoffset=(138.23*(1-rate/100)).toFixed(2);
    rf.style.stroke=rate===100?'var(--green)':rate>=50?'var(--gold)':'var(--sky)';
    const rv=document.getElementById('s-today');
    if(rv)rv.className='ring-val '+(rate===100?'green':rate>=50?'gold':'sky');
    const pw=document.querySelector('.progress-ring-wrap');
    if(pw)pw.classList.toggle('ring-complete',rate===100);
  }
}

let chartView='week';

function setChartView(v){
  chartView=v;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const ttl=document.getElementById('chart-ttl');

function renderList(){

  // Cycle 14: apply real-time search filter
  if(searchQuery)list=list.filter(h=>h.name.toLowerCase().includes(searchQuery)||(h.note&&h.note.toLowerCase().includes(searchQuery)));

  if(!list.length){
    const msg=searchQuery?`「${esc(searchQuery)}」に一致する習慣はありません`:'＋ボタンで習慣を追加しよう！';
    const ico=searchQuery?'🔍':'🌱';
    el.innerHTML=`<div class="empty"><div class="empty-ico">${ico}</div><div class="empty-txt">${msg}</div></div>`;
    return;
  }

  const cats=filter==='all'?['学習','運動','創作','自己改善']:[filter];

  for(const cat of cats){

    if(!ch.length)continue;

    const pct=ch.length?Math.round(done/ch.length*100):0;
    html+=`<div class="habit-sec"><div class="sec-hdr"><div class="sec-dot" style="background:${col}"></div><span class="sec-name" style="color:${col}">${cat}</span><div class="sec-progress"><div class="sec-progress-fill" style="width:${pct}%;background:${col}"></div></div><span class="sec-count">${done}/${ch.length}</span></div>`;
    for(const h of ch){
      const completedVal=dc[h.id];
      const isDone=!!completedVal;
      const cnt=habitTotalCount(h.id);
      const cntBadge=cnt>0?`<span class="habit-cnt">${cnt}日</span>`:'';
      const hs=habitStreak(h.id);
      const streakBadge=hs>=2?`<span class="habit-streak">🔥${hs}</span>`:'';
      // cycle 9: show completion time badge

        timeBadge=`<span class="done-time">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>`;
      }

      const dotsHtml=`<div class="h-dots" title="過去7日間の達成">${habit7Days(h.id).map(d=>`<span class="h-dot${d?' done':''}"></span>`).join('')}</div>`;

      const noteHtml=h.note?`<span class="habit-note">${esc(h.note)}</span>`:'';
      // cycle 15: emoji icon

// ── actions ──
function toggle(id,evt){
  const td=today();
  if(!completions[td])completions[td]={};
  const wasCompleted=!!completions[td][id];
  // cycle 9: store ISO timestamp on completion, null on undo
  completions[td][id]=wasCompleted?null:new Date().toISOString();
  if(!wasCompleted){
    playTick();vib(50);checkHabitMilestone(id);
    // cycle 18: particle burst from checkbox position
    if(evt){const chk=(evt.currentTarget||evt.target)?.querySelector?.('.chk');const r=chk?chk.getBoundingClientRect():null;if(r)spawnBurst(r.left+r.width/2,r.top+r.height/2);}
  }
  saveC();
  render();
  // cycle 2: celebration check
  if(todayRate()===100&&!celebrated){
    celebrated=true;
    showBanner();
    launchConfetti();
    playCelebration();
  }else if(todayRate()<100){
    celebrated=false;
  }
}

// ── Cycle 10: Undo delete snackbar ──
let _delHabit=null,_delIdx=null,_delTimer=null;
function del(id){
  if(_delTimer){clearTimeout(_delTimer);saveH();}  // commit any pending delete
  const idx=habits.findIndex(h=>h.id===id);
  if(idx===-1)return;
  _delHabit=habits[idx];_delIdx=idx;
  habits.splice(idx,1);
  vib(25);celebrated=false;render();
  document.getElementById('sb-msg').textContent=`「${_delHabit.name}」を削除しました`;
  const sb=document.getElementById('snackbar');
  sb.classList.add('show');
  _delTimer=setTimeout(()=>{saveH();_hideSb();},4000);
}
function _hideSb(){
  document.getElementById('snackbar').classList.remove('show');
  _delHabit=null;_delIdx=null;_delTimer=null;
}
function undoDelete(){
  if(!_delHabit)return;
  clearTimeout(_delTimer);
  habits.splice(_delIdx,0,_delHabit);
  saveH();_hideSb();render();
}

// cycle 6: JSON import
function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const data=JSON.parse(evt.target.result);
        if(!data.habits||!Array.isArray(data.habits))throw new Error();
        if(!confirm(`${data.habits.length}件の習慣データをインポートします。現在のデータは上書きされます。続けますか？`))return;
        habits=data.habits;completions=data.completions||{};
        saveH();saveC();celebrated=false;render();
      }catch{alert('インポートに失敗しました。正しいバックアップJSONを選択してください。');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

function launchConfetti(){
  const canvas=document.getElementById('cfv');
  const ctx=canvas.getContext('2d');
  canvas.width=innerWidth;canvas.height=innerHeight;
  const cols=document.body.classList.contains('light')?['#F5C842','#5BC8E8','#4CAF7D','#9B6DD6','#E8354A','#333333']:['#F5C842','#5BC8E8','#4CAF7D','#9B6DD6','#E8354A','#ffffff'];
  const ps=Array.from({length:130},()=>({
    x:Math.random()*canvas.width,
    y:-20-Math.random()*80,
    vx:(Math.random()-.5)*6,
    vy:2+Math.random()*4,
    col:cols[Math.floor(Math.random()*cols.length)],
    w:4+Math.random()*6,
    h:2+Math.random()*4,
    rot:Math.random()*Math.PI*2,
    rs:(Math.random()-.5)*.2,
    a:1
  }));
  let fr=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of ps){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.rot+=p.rs;
      if(p.y>canvas.height*.75)p.a-=.025;
      if(p.a<=0)continue;
      alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=p.a;ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(alive&&fr++<240)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// ── Cycle 18: weekday performance chart ──
function calcDayOfWeekStats(){
  const raw=Array(7).fill(0).map(()=>({sum:0,cnt:0}));
  for(let i=1;i<=28;i++){
    const dow=daysAgo(i).getDay();
    const r=dayRate(dateAgo(i));
    raw[dow].sum+=r;raw[dow].cnt++;
  }
  return raw.map(s=>s.cnt?Math.round(s.sum/s.cnt*100):null);
}
function renderDayOfWeekChart(){
  const box=document.getElementById('dow-box'),el=document.getElementById('dow-chart');
  if(!box||!el)return;
  const stats=calcDayOfWeekStats(); // indexed by JS day-of-week: 0=Sun
  const order=[1,2,3,4,5,6,0]; // display Mon→Sun
  const vals=order.map(i=>stats[i]);
  const defined=vals.filter(v=>v!==null);
  if(!defined.length){box.style.display='none';return;}
  box.style.display='';
  const max=Math.max(...defined,1);
  const bestIdx=vals.reduce((bi,v,i)=>v!==null&&(vals[bi]===null||v>vals[bi])?i:bi,0);
  const worstIdx=vals.reduce((wi,v,i)=>v!==null&&(vals[wi]===null||v<vals[wi])?i:wi,0);
  el.innerHTML=order.map((dow,i)=>{
    const v=vals[i]??0;
    const pct=Math.round(v/max*100);
    const color=i===bestIdx?'var(--green)':i===worstIdx?'rgba(232,53,74,.8)':'var(--gold)';
    const lblStyle=i===bestIdx?' style="color:var(--green)"':i===worstIdx?' style="color:var(--red)"':'';
    return `<div class="dow-col"><div class="dow-bar-wrap"><div class="dow-fill" style="height:${pct}%;background:${color}"></div></div><span class="dow-lbl"${lblStyle}>${DAYS[dow]}</span></div>`;
  }).join('');
}

load();
initTheme();
updateSoundBtn();
initCompactView();
initEmojiPresets();
render();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('overlay').classList.contains('open'))closeModal();
    else if(searchQuery)clearSearch();
  }
});
</script>
</body>
