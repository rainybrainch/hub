<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>習慣</title>
  <style>
    :root{--sky:#5BC8E8;--gold:#F5C842;--green:#4CAF7D;--red:#E8354A;--dark:#0d1117;--white:#fff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Zen Maru Gothic",sans-serif;background:var(--dark);color:var(--white);min-height:100vh;padding:40px 20px}
    .container{max-width:480px;margin:0 auto}
    .header{text-align:center;margin-bottom:32px}
    .header-title{font-size:40px;color:var(--white);margin:0;text-shadow:2px 2px 0 #D4A017}
    .dashboard{background:rgba(91,200,232,.08);border:1px solid rgba(91,200,232,.2);border-radius:12px;padding:20px;margin-bottom:28px}
    .dashboard-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .stat-card{text-align:center;background:rgba(26,31,58,.6);border-radius:8px;padding:12px}
    .stat-number{font-size:24px;font-weight:900;color:var(--sky)}
    .stat-label{font-size:9px;color:rgba(255,255,255,.5)}
    .form-section{background:rgba(26,31,58,.5);border:1px solid rgba(91,200,232,.15);border-radius:12px;padding:20px;margin:28px 0}
    .form-group{margin-bottom:12px}
    .form-group input,.form-group select{width:100%;padding:10px;background:rgba(91,200,232,.05);border:1px solid rgba(91,200,232,.25);border-radius:6px;color:var(--white);font-family:inherit;font-size:12px}
    .btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--sky),#4fb5d5);color:var(--dark);border:0;border-radius:6px;font-weight:700;cursor:pointer;margin-top:8px}
    .habit-item{background:rgba(26,31,58,.7);border:1px solid rgba(91,200,232,.15);border-radius:8px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
    .habit-checkbox{width:24px;height:24px;cursor:pointer}
    .habit-checkbox:checked{accent-color:var(--green)}
    .habit-name{flex:1;font-size:12px;font-weight:700}
    .habit-delete{width:28px;height:28px;background:rgba(232,53,74,.1);border:1px solid rgba(232,53,74,.3);border-radius:4px;color:var(--red);cursor:pointer;font-weight:700}
    .empty-state{text-align:center;padding:40px;color:rgba(255,255,255,.4)}
    footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid rgba(91,200,232,.1);font-size:11px;color:rgba(255,255,255,.3)}
  </style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1 class="header-title">📅 習慣</h1>
  </header>
  <div class="dashboard">
    <div class="dashboard-stat">
      <div class="stat-card"><div class="stat-number" id="stat-today">0</div><div class="stat-label">今日完了</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div class="stat-label">全習慣</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-rate">0%</div><div class="stat-label">完了率</div></div>
    </div>
  </div>
  <div class="form-section">
    <h3 style="color:var(--sky);margin-bottom:14px;">新しい習慣を追加</h3>
    <div class="form-group">
      <input id="habit-name" type="text" placeholder="習慣の名前">
    </div>
    <div class="form-group">
      <select id="habit-category">
        <option>📚 学習</option><option>💪 運動</option><option>🎨 創作</option><option>✨ 自己改善</option>
      </select>
    </div>
    <button class="btn" onclick="addHabit()">追加</button>
  </div>
  <div>
    <h3 style="font-size:12px;color:var(--sky);margin:20px 0 16px;">📋 今日の習慣</h3>
    <div id="habits-list"><div class="empty-state">習慣を追加してください</div></div>
  </div>
  <footer>
    <p>習慣アプリ v1.0 - RAINYBRAIN Hub</p>
    <p style="margin-top:8px;"><a href="index.html" style="color:var(--sky);text-decoration:none;">← Hubに戻る</a></p>
  </footer>
</div>
<script>
const SK='habit_data';let d={habits:[]};function init(){try{d=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}render();setInterval(render,60000)}function render(){const t=new Date().toISOString().split('T')[0];let c=0;d.habits.forEach(h=>{if(h.log&&h.log[t])c++});document.getElementById('stat-today').textContent=c;document.getElementById('stat-total').textContent=d.habits.length;const r=d.habits.length?Math.round(c*100/d.habits.length):0;document.getElementById('stat-rate').textContent=r+'%';let html='';d.habits.forEach(h=>{const done=h.log&&h.log[t];html+=`<div class="habit-item"><input type="checkbox" class="habit-checkbox" ${done?'checked':''} onchange="toggle('${h.id}')"><div class="habit-name">${h.name}</div><button class="habit-delete" onclick="del('${h.id}')">x</button></div>`});document.getElementById('habits-list').innerHTML=html||'<div class="empty-state">習慣を追加してください</div>';localStorage.setItem(SK,JSON.stringify(d))}function addHabit(){const n=document.getElementById('habit-name').value.trim();if(!n)return;d.habits.push({id:'h_'+Date.now(),name:n,log:{}});document.getElementById('habit-name').value='';render()}function toggle(id){const t=new Date().toISOString().split('T')[0];const h=d.habits.find(x=>x.id===id);if(!h)return;if(!h.log)h.log={};h.log[t]=!h.log[t];render()}function del(id){d.habits=d.habits.filter(h=>h.id!==id);render()}window.addEventListener('load',init);
</script>
</body>
</html>
