<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RainyBrainch Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #fafafa;
    }

    header p {
      font-size: 13px;
      color: #52525b;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    a.card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    a.card:hover {
      border-color: #4f46e5;
      background: #18181b;
      transform: translateY(-2px);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #fafafa;
    }

    .card-desc {
      font-size: 12px;
      color: #71717a;
      line-height: 1.5;
    }

    .card-arrow {
      margin-top: auto;
      font-size: 12px;
      color: #4f46e5;
    }

    footer {
      margin-top: 48px;
      font-size: 11px;
      color: #3f3f46;
    }
  </style>
</head>
<body>

  <header>
    <h1>RainyBrainch Hub</h1>
    <p>ツールへのショートカット</p>
  </header>

  <div class="grid">

    <a class="card" href="https://transcription-app-production-04da.up.railway.app" target="_blank" rel="noopener">
      <div class="card-icon" style="background:#1e1b4b;">🎙</div>
      <div class="card-title">文字起こしアプリ</div>
      <div class="card-desc">MP3・WAVをアップロードして自動文字起こし。リアルタイム録音にも対応。</div>
      <div class="card-arrow">開く →</div>
    </a>

    <a class="card" href="https://rainybrainch.github.io/live/streams/index.html" target="_blank" rel="noopener">
      <div class="card-icon" style="background:#0f172a;">📡</div>
      <div class="card-title">Channel OS ストリーム</div>
      <div class="card-desc">RAINYBRAIN配信システム。ストリーム画面。</div>
      <div class="card-arrow">開く →</div>
    </a>

    <a class="card" href="https://rainybrainch.github.io/manebou-hp/" target="_blank" rel="noopener">
      <div class="card-icon" style="background:#052e16;">📚</div>
      <div class="card-title">マネぼう塾</div>
      <div class="card-desc">Monebou Juku — 学習サポートサイト。</div>
      <div class="card-arrow">開く →</div>
    </a>

    <a class="card" href="https://app.notion.com/p/2fbd8fc4b38280929d01ce8486606b88" target="_blank" rel="noopener">
      <div class="card-icon" style="background:#1c1c1c;">📝</div>
      <div class="card-title">マネぼう Notion</div>
      <div class="card-desc">マネぼう / Monebou — Notionワークスペース。</div>
      <div class="card-arrow">開く →</div>
    </a>

  </div>

  <footer>rainybrainch · 2026</footer>

</body>
</html>
