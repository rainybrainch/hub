<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RainyBrainch Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080809;
      --surface: #0f0f11;
      --surface-hover: #141416;
      --border: #1e1e22;
      --border-hover: #3a3a42;
      --text: #ececec;
      --text-secondary: #5c5c66;
      --text-muted: #3a3a42;
      --accent: #7c6af7;
      --accent-dim: rgba(124,106,247,0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 56px 24px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      margin-bottom: 52px;
    }

    .header-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.8px;
      line-height: 1.2;
    }

    /* Section */
    .section {
      margin-bottom: 40px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Card grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-dim);
      opacity: 0;
      transition: opacity 0.12s;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .card:hover::after {
      opacity: 0;
    }

    .card:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.12s, transform 0.12s;
    }

    /* Footer */
    footer {
      margin-top: 64px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    footer::before {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
<div class="container">

  <header class="header">

  </section>

  <section class="section">

    <div class="cards">

      <a class="card" href="https://rainybrainch.github.io/manebou-hp/home.html" target="_blank" rel="noopener">

</div>
</body>
</html>
