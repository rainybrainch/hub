<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>RainyBrainch Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #5BC8E8;
      --gold: #F5C842;
      --gold-dark: #D4A017;
      --green: #4CAF7D;
      --red: #E8354A;
      --purple: #9B6DD6;
      --dark: #1A1A2E;
      --white: #FFFFFF;
      --cream: #FFFDF5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      padding: 56px 20px 80px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 52px;
    }

    .header-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .header-title {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: clamp(42px, 10vw, 64px);
      line-height: 1;
      letter-spacing: -1px;
      color: var(--white);
      text-shadow: 4px 4px 0 var(--gold-dark);
    }

    .header-sub {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.15em;
    }

    /* Section */
    .section {
      margin-bottom: 44px;
    }

    .section-label {
      display: inline-block;
      background: var(--gold);
      color: var(--dark);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px 16px;
      background: var(--cream);
      border: 3px solid var(--dark);
      border-radius: 18px;
      text-decoration: none;
      color: var(--dark);
      box-shadow: 4px 4px 0 var(--dark);
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
    }

    .card:hover {
      transform: translate(-2px, -2px);
    }

    /* Per-card accent colors */
    .card-sky  { box-shadow: 4px 4px 0 var(--sky);    border-color: var(--dark); }
    .card-gold { box-shadow: 4px 4px 0 var(--gold-dark); }
    .card-green{ box-shadow: 4px 4px 0 var(--green);  }
    .card-red  { box-shadow: 4px 4px 0 var(--red);    }
    .card-purple{ box-shadow: 4px 4px 0 var(--purple); }

    .card-sky:hover   { box-shadow: 6px 6px 0 var(--sky);     }
    .card-gold:hover  { box-shadow: 6px 6px 0 var(--gold-dark); }
    .card-green:hover { box-shadow: 6px 6px 0 var(--green);   }
    .card-red:hover   { box-shadow: 6px 6px 0 var(--red);     }
    .card-purple:hover{ box-shadow: 6px 6px 0 var(--purple);  }

    .card-icon {
      font-size: 28px;
      line-height: 1;
    }

    .card-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: var(--dark);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 11px;
      color: #666;
      line-height: 1.6;
    }

    .card-arrow {
      margin-top: auto;
      font-size: 11px;
      font-weight: 700;
      color: #999;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.2em;
    }
  </style>
</head>
